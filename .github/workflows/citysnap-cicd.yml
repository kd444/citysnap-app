name: City Snap – Frontend Auto Build & Deploy

on:
    push:
        branches: [main, develop]
        paths:
            - "**"
    pull_request:
        types: [opened, synchronize, reopened, closed]
        branches: [main, develop]
        paths:
            - "**"
    workflow_dispatch:

# ────────────────────────────────────────────────────────────────
# Unified CI/CD for City Snap web client
# Builds once → deploys to environment per branch
# Requires these repository secrets:
#   CITYSNAP_SWA_TOKEN_PROD  (for main)
#   CITYSNAP_SWA_TOKEN_DEV   (for develop)
# ────────────────────────────────────────────────────────────────

env:
    APP_PATH: .
    BUILD_PATH: .next

concurrency:
    group: csnap-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    statuses: write

jobs:
    build:
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
        name: 🏗️ Build Frontend
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ${{ env.APP_PATH }}

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Setup Node.js environment
              uses: actions/setup-node@v4
              with:
                  node-version: 18
                  cache: "npm"
                  cache-dependency-path: ${{ env.APP_PATH }}/package-lock.json

            - name: Install packages
              run: npm ci

            - name: Code quality check
              run: npm run lint --if-present

            - name: Compile Next.js build
              env:
                  NODE_ENV: production
                  NEXT_PUBLIC_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
              run: npm run build

            - name: Show workspace and .next contents
              run: |
                  pwd
                  ls -la
                  echo "--- ${{ env.BUILD_PATH }} ---"
                  ls -la ${{ env.BUILD_PATH }} || true

            - name: Verify build output exists
              run: |
                  test -d ${{ env.BUILD_PATH }} && [ "$(ls -A ${{ env.BUILD_PATH }})" ] || { echo "${{ env.BUILD_PATH }} is missing or empty"; exit 1; }

            - name: Save build output
              uses: actions/upload-artifact@v4
              with:
                  name: csnap-next-build
                  path: ${{ github.workspace }}/${{ env.BUILD_PATH }}
                  if-no-files-found: error
                  retention-days: 7
                  include-hidden-files: true

    deploy-prod:
        needs: build
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')) }}
        name: 🚀 Deploy to Production
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Retrieve build
              uses: actions/download-artifact@v4
              with:
                  name: csnap-next-build
                  path: ${{ github.workspace }}/${{ env.BUILD_PATH }}

            - name: Upload to Azure Static Web App (Production)
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.CITYSNAP_SWA_TOKEN_PROD }}
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  action: upload
                  app_location: ${{ env.APP_PATH }}
                  output_location: ${{ env.BUILD_PATH }}
                  skip_app_build: true

    deploy-dev:
        needs: build
        if: ${{ github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')) }}
        name: 🌐 Deploy to Development
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Retrieve build
              uses: actions/download-artifact@v4
              with:
                  name: csnap-next-build
                  path: ${{ github.workspace }}/${{ env.BUILD_PATH }}

            - name: Upload to Azure Static Web App (Development)
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.CITYSNAP_SWA_TOKEN_DEV }}
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  action: upload
                  app_location: ${{ env.APP_PATH }}
                  output_location: ${{ env.BUILD_PATH }}
                  skip_app_build: true

    cleanup-preview:
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
        name: 🧹 Remove Preview Environments
        runs-on: ubuntu-latest
        steps:
            - name: Close Preview (main branch)
              if: ${{ github.base_ref == 'main' }}
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.CITYSNAP_SWA_TOKEN_PROD }}
                  action: close

            - name: Close Preview (develop branch)
              if: ${{ github.base_ref == 'develop' }}
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.CITYSNAP_SWA_TOKEN_DEV }}
                  action: close
